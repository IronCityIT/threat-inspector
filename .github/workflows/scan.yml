name: Iron City Threat Inspector - Scan

# ============================================================
# Unified modular scan entry point. One workflow, module/group selection —
# the same catalog the dashboard renders. Selection maps 1:1 to the CLI:
#   modules:  run exactly these modules (overrides group)
#   group:    quick | standard | deep
# Findings flow through the shared analyze/store pipeline (_consensus-store.yml).
# White-label: no underlying scanner names appear in client-visible output.
#
# Two entry points:
#   workflow_dispatch — operator-driven, target and client_name are required.
#   schedule          — standing weekly baseline scan. A cron event carries no
#                       inputs at all, so the run falls back to the baseline
#                       target/client below. Every downstream job therefore
#                       reads the RESOLVED values (scan job outputs), never
#                       `inputs.*` directly, which are empty on a cron run.
# ============================================================

on:
  # Mondays 07:00 UTC — before the US business week, off the top of the hour
  # so it is not competing with the rest of the fleet's cron traffic.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Domain, URL, or IP to scan'
        required: true
        type: string
      client_name:
        description: 'Client identifier'
        required: true
        type: string
      scan_id:
        description: 'Unique scan identifier'
        required: false
        type: string
      modules:
        description: 'Comma list of modules to run (overrides group)'
        required: false
        type: string
      group:
        description: 'Named group preset (ignored when modules is set)'
        required: false
        type: choice
        default: 'standard'
        options:
          - quick
          - standard
          - deep
      dry_run:
        description: 'Validate targets and selection without scanning anything'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Baseline used only when the run has no dispatch inputs (i.e. schedule).
env:
  BASELINE_TARGET: ironcityit.com
  BASELINE_CLIENT: ironcity
  BASELINE_GROUP: standard

concurrency:
  group: scan-${{ inputs.client_name || 'scheduled' }}
  cancel-in-progress: false

jobs:
  scan:
    name: Modular Scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      scan_id: ${{ steps.ids.outputs.scan_id }}
      target: ${{ steps.ids.outputs.target }}
      client_name: ${{ steps.ids.outputs.client_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve scan identifiers
        id: ids
        env:
          TARGET_IN: ${{ inputs.target }}
          CLIENT_NAME_IN: ${{ inputs.client_name }}
          SCAN_ID_IN: ${{ inputs.scan_id }}
          GROUP_IN: ${{ inputs.group }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TARGET="${TARGET_IN:-}"
          CLIENT_NAME="${CLIENT_NAME_IN:-}"
          GROUP="${GROUP_IN:-}"
          # A cron event supplies no inputs, so the standing baseline applies.
          # A manual dispatch still has to say what it is scanning.
          if [ "$EVENT" = "schedule" ]; then
            TARGET="${TARGET:-$BASELINE_TARGET}"
            CLIENT_NAME="${CLIENT_NAME:-$BASELINE_CLIENT}"
            GROUP="${GROUP:-$BASELINE_GROUP}"
          fi
          if [ -z "$TARGET" ]; then echo "::error::target is required"; exit 1; fi
          if [ -z "$CLIENT_NAME" ]; then echo "::error::client_name is required"; exit 1; fi
          SCAN_ID="${SCAN_ID_IN:-}"
          [ -z "$SCAN_ID" ] && SCAN_ID="ti-${RUN_ID}"
          {
            echo "scan_id=$SCAN_ID"
            echo "target=$TARGET"
            echo "client_name=$CLIENT_NAME"
            echo "group=${GROUP:-$BASELINE_GROUP}"
          } >> "$GITHUB_OUTPUT"
          echo "Inputs resolved (event: $EVENT, client: $CLIENT_NAME, scan_id: $SCAN_ID)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scanners
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap
          wget -q https://github.com/projectdiscovery/subfinder/releases/download/v2.6.3/subfinder_2.6.3_linux_amd64.zip -O subfinder.zip
          unzip -o -q subfinder.zip && chmod +x subfinder && sudo mv subfinder /usr/local/bin/
          wget -q https://github.com/projectdiscovery/nuclei/releases/download/v3.1.10/nuclei_3.1.10_linux_amd64.zip -O nuclei.zip
          unzip -o -q nuclei.zip && chmod +x nuclei && sudo mv nuclei /usr/local/bin/

      - name: Run modular scan
        env:
          TARGET: ${{ steps.ids.outputs.target }}
          CLIENT_NAME: ${{ steps.ids.outputs.client_name }}
          SCAN_ID: ${{ steps.ids.outputs.scan_id }}
          MODULES: ${{ inputs.modules }}
          GROUP: ${{ steps.ids.outputs.group }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mkdir -p results
          # --modules wins over --group; mirrors registry.select() precedence.
          if [ -n "$MODULES" ]; then
            SEL=(--modules "$MODULES")
          else
            SEL=(--group "${GROUP:-standard}")
          fi
          # A dry run exercises the whole pipeline — selection, JSON schema,
          # consensus call, store POST — without a packet reaching a live host.
          if [ "$DRY_RUN" = "true" ]; then SEL+=(--dry-run); fi
          echo "Running scan (${SEL[*]})"
          # stderr is kept as a job artifact so a failed run is diagnosable
          # without re-running the scan.
          set +e
          python3 module_framework/cli.py "${SEL[@]}" \
            --targets "$TARGET" \
            --client "$CLIENT_NAME" \
            --scan-id "$SCAN_ID" > results/findings.json 2> results/scan-stderr.log
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::error::scan exited with code $RC"
            echo "--- captured stderr ---"
            cat results/scan-stderr.log || true
            exit $RC
          fi
          # Validation gate: the findings file is the pipeline's only contract.
          [ "$(head -c 1 results/findings.json)" = "{" ] || {
            echo "::error::findings.json does not start with {"; cat results/scan-stderr.log || true; exit 1; }
          python3 -m json.tool results/findings.json > /dev/null
          python3 -c "import json;d=json.load(open('results/findings.json'));print('modules:',d['modules_run'],'findings:',len(d['findings']))"

      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: ti-findings-${{ steps.ids.outputs.scan_id }}
          path: results/
          retention-days: 90

      - name: Upload scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ti-diagnostics-${{ github.run_id }}
          path: results/scan-stderr.log
          retention-days: 30
          if-no-files-found: ignore

  pipeline:
    name: Analyze & Store
    needs: scan
    uses: ./.github/workflows/_consensus-store.yml
    with:
      scan_type: modular_scan
      target: ${{ needs.scan.outputs.target }}
      client_name: ${{ needs.scan.outputs.client_name }}
      scan_id: ${{ needs.scan.outputs.scan_id }}
      findings_artifact: ti-findings-${{ needs.scan.outputs.scan_id }}
    secrets: inherit

  # Without this the dashboard would show a scan stuck at "running" forever:
  # when `scan` fails, `pipeline` is skipped and nothing is ever written.
  # NOTE: the scan job's outputs are empty when the scan job itself failed
  # early, so this falls back to the same baseline the scan job would have used.
  report-failure:
    name: Report Failure
    needs: [scan, pipeline]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/_report-failure.yml
    with:
      scan_type: modular_scan
      target: ${{ needs.scan.outputs.target || inputs.target || 'ironcityit.com' }}
      client_name: ${{ needs.scan.outputs.client_name || inputs.client_name || 'ironcity' }}
      scan_id: ${{ needs.scan.outputs.scan_id || format('ti-{0}', github.run_id) }}
      run_id: ${{ github.run_id }}
      scan_id_prefix: ti
      failed_stage: ${{ needs.scan.result == 'failure' && 'scan' || 'analyze-store' }}
    secrets: inherit
