name: Iron City Threat Inspector - Port Scan

# ============================================================
# PORT SCAN - Discover open ports and services (blue-team recon)
# Uses nmap internally. Triggered via workflow_dispatch only.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Domain, URL, or IP to scan'
        required: true
      client_name:
        description: 'Client identifier'
        required: true
      scan_id:
        description: 'Unique scan identifier'
        required: false
      scan_type:
        description: 'Scan depth: quick, standard, or full'
        required: false
        default: 'standard'

permissions:
  contents: read

concurrency:
  group: port-scan-${{ inputs.client_name }}
  cancel-in-progress: false

jobs:
  scan:
    name: Port Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      scan_id: ${{ steps.ids.outputs.scan_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve scan identifiers
        id: ids
        run: |
          if [ -z "${{ inputs.target }}" ]; then
            echo "❌ ERROR: target is required"; exit 1
          fi
          if [ -z "${{ inputs.client_name }}" ]; then
            echo "❌ ERROR: client_name is required"; exit 1
          fi
          SCAN_ID="${{ inputs.scan_id }}"
          [ -z "$SCAN_ID" ] && SCAN_ID="ti-${{ github.run_id }}"
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Inputs validated (client: ${{ inputs.client_name }}, scan_id: $SCAN_ID)"

      - name: Install scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap

      - name: Run port scan
        env:
          TARGET: ${{ inputs.target }}
          CLIENT_NAME: ${{ inputs.client_name }}
          SCAN_ID: ${{ steps.ids.outputs.scan_id }}
        run: |
          mkdir -p results
          # Re-housed onto the shared module framework: port discovery + service ID.
          python3 module_framework/cli.py --modules port_scan,service_fingerprint \
            --targets "$TARGET" \
            --client "$CLIENT_NAME" \
            --scan-id "$SCAN_ID" > results/findings.json
          python3 -c "import json;d=json.load(open('results/findings.json'));print('📊 findings:',len(d['findings']))"

      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: ti-findings-${{ steps.ids.outputs.scan_id }}
          path: results/
          retention-days: 90

  pipeline:
    name: Analyze & Store
    needs: scan
    uses: ./.github/workflows/_consensus-store.yml
    with:
      scan_type: port_scan
      target: ${{ inputs.target }}
      client_name: ${{ inputs.client_name }}
      scan_id: ${{ needs.scan.outputs.scan_id }}
      findings_artifact: ti-findings-${{ needs.scan.outputs.scan_id }}
    secrets: inherit
