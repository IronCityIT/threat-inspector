name: Iron City Threat Inspector - Asset Discovery

# ============================================================
# ASSET DISCOVERY - Enumerate subdomains and live assets.
# Uses subfinder + httpx internally. workflow_dispatch only.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Domain, URL, or IP to scan'
        required: true
      client_name:
        description: 'Client identifier'
        required: true
      scan_id:
        description: 'Unique scan identifier'
        required: false

permissions:
  contents: read

concurrency:
  group: asset-discovery-${{ inputs.client_name }}
  cancel-in-progress: false

jobs:
  scan:
    name: Asset Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      scan_id: ${{ steps.ids.outputs.scan_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve scan identifiers
        id: ids
        run: |
          if [ -z "${{ inputs.target }}" ]; then
            echo "❌ ERROR: target is required"; exit 1
          fi
          if [ -z "${{ inputs.client_name }}" ]; then
            echo "❌ ERROR: client_name is required"; exit 1
          fi
          TARGET=$(echo "${{ inputs.target }}" | sed 's|https://||g; s|http://||g; s|/.*||g')
          echo "target_clean=$TARGET" >> "$GITHUB_ENV"
          SCAN_ID="${{ inputs.scan_id }}"
          [ -z "$SCAN_ID" ] && SCAN_ID="ti-${{ github.run_id }}"
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Inputs validated (client: ${{ inputs.client_name }}, target: $TARGET)"

      - name: Install tools
        run: |
          wget -q https://github.com/projectdiscovery/subfinder/releases/download/v2.6.3/subfinder_2.6.3_linux_amd64.zip -O subfinder.zip
          unzip -o -q subfinder.zip && chmod +x subfinder && sudo mv subfinder /usr/local/bin/

      - name: Run asset discovery
        env:
          TARGET: ${{ env.target_clean }}
          CLIENT_NAME: ${{ inputs.client_name }}
          SCAN_ID: ${{ steps.ids.outputs.scan_id }}
        run: |
          mkdir -p results
          # Re-housed onto the shared module framework: subdomain enumeration.
          python3 module_framework/cli.py --modules subdomain_enum \
            --targets "$TARGET" \
            --client "$CLIENT_NAME" \
            --scan-id "$SCAN_ID" > results/findings.json
          python3 -c "import json;d=json.load(open('results/findings.json'));print('📊 findings:',len(d['findings']))"

      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: ti-findings-${{ steps.ids.outputs.scan_id }}
          path: results/
          retention-days: 90

  pipeline:
    name: Analyze & Store
    needs: scan
    uses: ./.github/workflows/_consensus-store.yml
    with:
      scan_type: subdomain_enum
      target: ${{ inputs.target }}
      client_name: ${{ inputs.client_name }}
      scan_id: ${{ needs.scan.outputs.scan_id }}
      findings_artifact: ti-findings-${{ needs.scan.outputs.scan_id }}
    secrets: inherit
