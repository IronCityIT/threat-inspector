name: Iron City Threat Inspector - Asset Discovery

# ============================================================
# ASSET DISCOVERY - Enumerate subdomains and live assets.
# Uses subfinder + httpx internally. workflow_dispatch only.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Domain, URL, or IP to scan'
        required: true
      client_name:
        description: 'Client identifier'
        required: true
      scan_id:
        description: 'Unique scan identifier'
        required: false

permissions:
  contents: read

concurrency:
  group: asset-discovery-${{ inputs.client_name }}
  cancel-in-progress: false

jobs:
  scan:
    name: Asset Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      scan_id: ${{ steps.ids.outputs.scan_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve scan identifiers
        id: ids
        run: |
          if [ -z "${{ inputs.target }}" ]; then
            echo "❌ ERROR: target is required"; exit 1
          fi
          if [ -z "${{ inputs.client_name }}" ]; then
            echo "❌ ERROR: client_name is required"; exit 1
          fi
          TARGET=$(echo "${{ inputs.target }}" | sed 's|https://||g; s|http://||g; s|/.*||g')
          echo "target_clean=$TARGET" >> "$GITHUB_ENV"
          SCAN_ID="${{ inputs.scan_id }}"
          [ -z "$SCAN_ID" ] && SCAN_ID="ti-${{ github.run_id }}"
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Inputs validated (client: ${{ inputs.client_name }}, target: $TARGET)"

      - name: Install tools
        run: |
          wget -q https://github.com/projectdiscovery/subfinder/releases/download/v2.6.3/subfinder_2.6.3_linux_amd64.zip -O subfinder.zip
          unzip -o -q subfinder.zip && chmod +x subfinder && sudo mv subfinder /usr/local/bin/
          wget -q https://github.com/projectdiscovery/httpx/releases/download/v1.3.7/httpx_1.3.7_linux_amd64.zip -O httpx.zip
          unzip -o -q httpx.zip && chmod +x httpx && sudo mv httpx /usr/local/bin/

      - name: Enumerate subdomains
        run: |
          TARGET="${{ env.target_clean }}"
          mkdir -p results
          echo "🔍 Enumerating assets for $TARGET"
          subfinder -d $TARGET -silent -o results/subdomains.txt || touch results/subdomains.txt
          echo "📊 Subdomains found: $(wc -l < results/subdomains.txt)"

      - name: Probe live hosts
        run: |
          if [ -s results/subdomains.txt ]; then
            cat results/subdomains.txt | httpx -silent -status-code -title -o results/live-hosts.txt || touch results/live-hosts.txt
          else
            touch results/live-hosts.txt
          fi
          echo "📊 Live hosts: $(wc -l < results/live-hosts.txt)"

      - name: Build findings
        env:
          TARGET: ${{ env.target_clean }}
          CLIENT_NAME: ${{ inputs.client_name }}
          SCAN_ID: ${{ steps.ids.outputs.scan_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          target = os.environ["TARGET"]
          subs = []
          try:
              with open("results/subdomains.txt") as fh:
                  subs = [l.strip() for l in fh if l.strip()]
          except FileNotFoundError:
              pass
          live = []
          try:
              with open("results/live-hosts.txt") as fh:
                  live = [l.strip() for l in fh if l.strip()]
          except FileNotFoundError:
              pass
          findings = []
          for host in live:
              url = host.split()[0]
              findings.append({"module": "subdomain_enum", "target": target, "severity": "info",
                               "title": f"Live asset discovered: {url}",
                               "detail": "Publicly reachable asset associated with the target domain.",
                               "evidence": {"host": host}})
          out = {"client": os.environ["CLIENT_NAME"], "scan_id": os.environ["SCAN_ID"],
                 "modules_run": ["subdomain_enum"], "target_count": 1, "findings": findings}
          out["evidence_summary"] = {"subdomains": len(subs), "live_hosts": len(live)}
          with open("results/findings.json", "w") as fh:
              json.dump(out, fh, indent=2)
          print(f"📊 Findings: {len(findings)} (subdomains: {len(subs)}, live: {len(live)})")
          PYEOF

      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: ti-findings-${{ steps.ids.outputs.scan_id }}
          path: results/
          retention-days: 90

  pipeline:
    name: Analyze & Store
    needs: scan
    uses: ./.github/workflows/_consensus-store.yml
    with:
      scan_type: subdomain_enum
      target: ${{ inputs.target }}
      client_name: ${{ inputs.client_name }}
      scan_id: ${{ needs.scan.outputs.scan_id }}
      findings_artifact: ti-findings-${{ needs.scan.outputs.scan_id }}
    secrets: inherit
