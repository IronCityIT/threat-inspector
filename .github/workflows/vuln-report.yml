name: Iron City Threat Inspector - Vulnerability Report

# ============================================================
# VULNERABILITY REPORT - Aggregate uploaded scan exports into
# normalized, white-labeled findings. workflow_dispatch only.
# Source tool names are mapped to Iron City categories before storage.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Domain, URL, or IP the uploaded scans cover'
        required: true
      client_name:
        description: 'Client identifier'
        required: true
      scan_id:
        description: 'Unique scan identifier'
        required: false

permissions:
  contents: read

concurrency:
  group: vuln-report-${{ inputs.client_name }}
  cancel-in-progress: false

jobs:
  scan:
    name: Aggregate Findings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      scan_id: ${{ steps.ids.outputs.scan_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve scan identifiers
        id: ids
        run: |
          if [ -z "${{ inputs.client_name }}" ]; then
            echo "❌ ERROR: client_name is required"; exit 1
          fi
          SCAN_ID="${{ inputs.scan_id }}"
          [ -z "$SCAN_ID" ] && SCAN_ID="ti-${{ github.run_id }}"
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Inputs validated (client: ${{ inputs.client_name }}, scan_id: $SCAN_ID)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl lxml pyyaml

      - name: Aggregate scan exports
        env:
          TARGET: ${{ inputs.target }}
          CLIENT_NAME: ${{ inputs.client_name }}
          SCAN_ID: ${{ steps.ids.outputs.scan_id }}
        run: |
          mkdir -p results
          python3 - <<'PYEOF'
          import os, json, re, yaml
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # White-label: never store or display the underlying tool name. Map the
          # internal source to an Iron City category before it leaves this job.
          SOURCE_LABEL = {"qualys": "Vulnerability Assessment", "zap": "Web Application Scan",
                          "nmap": "Network Scan"}
          MODULE = {"qualys": "vulnerability_assessment", "zap": "web_app_scan", "nmap": "network_scan"}

          def norm_sev(s):
              s = str(s).lower()
              if "crit" in s: return "critical"
              if "high" in s: return "high"
              if "med" in s: return "medium"
              if "low" in s: return "low"
              return "info"

          config = {}
          if Path("configs/client.yaml").exists():
              config = yaml.safe_load(open("configs/client.yaml")) or {}
          scan_files = config.get("scan_files", {})
          target = os.environ["TARGET"]
          findings = []

          def add(src, title, sev, detail=""):
              findings.append({"module": MODULE[src], "target": target, "severity": norm_sev(sev),
                               "title": title, "detail": detail[:500],
                               "evidence": {"source": SOURCE_LABEL[src]}})

          qf = scan_files.get("qualys")
          if qf and Path(qf).exists():
              import pandas as pd
              df = pd.read_csv(qf) if qf.endswith(".csv") else pd.read_excel(qf, engine="openpyxl")
              for _, row in df.iterrows():
                  title = str(row.get("Vulnerability Title", row.get("Title", ""))).strip()
                  if title and title != "nan":
                      add("qualys", title, row.get("Severity", row.get("Risk", "info")),
                          str(row.get("Description", "")))

          zf = scan_files.get("zap")
          if zf and Path(zf).exists():
              risk_map = {"0": "info", "1": "low", "2": "medium", "3": "high"}
              root = ET.parse(zf).getroot()
              for alert in root.findall(".//alertitem"):
                  t = alert.find("alert"); r = alert.find("riskcode"); d = alert.find("desc")
                  add("zap", t.text if t is not None else "Finding",
                      risk_map.get(r.text if r is not None else "0", "info"),
                      (d.text or "") if d is not None else "")

          nf = scan_files.get("nmap")
          if nf and Path(nf).exists():
              content = open(nf).read()
              for m in re.finditer(r"(\S+)\s+.*VULNERABLE", content, re.IGNORECASE):
                  add("nmap", f"Vulnerable service detected: {m.group(1)}", "high", m.group(0))

          out = {"client": os.environ["CLIENT_NAME"], "scan_id": os.environ["SCAN_ID"],
                 "modules_run": sorted({f["module"] for f in findings}) or ["vulnerability_assessment"],
                 "target_count": 1, "findings": findings}
          with open("results/findings.json", "w") as fh:
              json.dump(out, fh, indent=2)
          print(f"📊 Aggregated {len(findings)} findings")
          PYEOF

      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: ti-findings-${{ steps.ids.outputs.scan_id }}
          path: results/
          retention-days: 90

  pipeline:
    name: Analyze & Store
    needs: scan
    uses: ./.github/workflows/_consensus-store.yml
    with:
      scan_type: vulnerability_report
      target: ${{ inputs.target }}
      client_name: ${{ inputs.client_name }}
      scan_id: ${{ needs.scan.outputs.scan_id }}
      findings_artifact: ti-findings-${{ needs.scan.outputs.scan_id }}
    secrets: inherit
