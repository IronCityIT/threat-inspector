name: CI

# Quality gates, enforced. These were being run by hand, which meant a red gate
# only blocked a merge if someone remembered to look.

on:
  pull_request:
  push:
    branches: [main]
  # Without this there is no way to re-run the gates on main short of pushing a
  # commit, which makes a merge that fails to trigger CI invisible until the
  # next change lands.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Format
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy module_framework src
      - name: Tests
        run: python -m pytest -q
      # Audits the REQUIREMENTS FILES, not the ambient environment. Auditing the
      # environment picks up whatever else happens to be installed on the runner
      # and fails on packages this project does not ship.
      - name: Dependency audit
        run: |
          python -m pip install -q pip-audit
          python -m pip_audit -r requirements.txt -r requirements-dev.txt             --progress-spinner=off

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # nmap is installed so the external-scanner modules are exercised through
      # the REAL scanner against a listener the test owns on loopback. Without
      # it those checks SKIP (loudly) rather than silently passing, and the only
      # thing proving the parsers still match current nmap output is lost.
      - name: Install nmap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nmap
      # Drives the real entry points as subprocesses against the committed
      # fixtures and a live HTTP server on loopback. Unit tests prove the pieces;
      # this proves they are still wired together.
      - name: Smoke test
        run: python3 tools/smoke_test.py

  catalog:
    name: Dashboard catalog is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The registries import their modules to enumerate them, so the runtime
      # dependencies have to be present for --list-modules to work at all.
      - run: pip install -r requirements.txt
      # A stale catalog means the dashboard offers modules the CLI does not have.
      - name: Rebuild and compare
        run: |
          python3 tools/build_catalog.py
          git diff --exit-code -- dashboard/public/catalog.json \
            || { echo "::error::catalog.json is stale — run tools/build_catalog.py"; exit 1; }

  ui:
    name: Dashboard browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm ci` only — the `|| npm install` fallback silently resolved a fresh
      # tree whenever the lockfile did not match, which defeats the lockfile.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:ui

  # The ONLY thing that can prove "no cross-tenant leakage" behaviourally.
  # tests/test_firestore_rules.py asserts the shape of the rules; this loads the
  # committed rules into a real Firestore emulator, seeds two tenants, and tries
  # to read across them. It needs Java (preinstalled on GitHub runners) and
  # firebase-tools, neither of which was available in the environment this
  # branch was developed in — see docs/SDLC_STATUS.md §4.
  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm install --no-save firebase-tools @firebase/rules-unit-testing firebase
      # emulators:exec starts the emulator, exports FIRESTORE_EMULATOR_HOST into
      # the child, and exits non-zero if the child does. The test SKIPS loudly
      # rather than passing if that variable is somehow absent.
      - name: Rules tests
        run: npx firebase emulators:exec --only firestore --project demo-threat-inspector "node tests/functions/rules.test.mjs"

  workflows:
    name: Workflow YAML parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Parse every workflow
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml,sys;yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error::$f does not parse"; exit 1; }
            echo "ok $f"
          done

  functions:
    name: Cloud Functions parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm ci` needs the committed lockfile; it is no longer allowed to fall
      # back to `npm install`, which resolved a fresh tree on every run and made
      # the deployed dependency set unreproducible.
      - working-directory: functions
        run: npm ci
      - name: Syntax check
        working-directory: functions
        run: |
          for f in index.js trigger.js exchange.js; do node --check "$f"; done
      - name: Dependency audit
        working-directory: functions
        run: npm audit --audit-level=high
      - name: Function unit tests
        run: npm run test:functions
