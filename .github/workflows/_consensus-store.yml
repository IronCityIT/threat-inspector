name: Iron City Threat Inspector - Analyze & Store

# ============================================================
# Reusable pipeline shared by every scan workflow.
#   findings --> AI consensus analysis --> storeScanResults (Firestore)
# White-label: no underlying tool names appear in any client-visible output.
# ============================================================

on:
  workflow_call:
    inputs:
      scan_type:
        description: 'Internal scan category (e.g. port_scan, tls_check)'
        required: true
        type: string
      target:
        description: 'Domain, URL, or IP that was scanned'
        required: true
        type: string
      client_name:
        description: 'Client identifier'
        required: true
        type: string
      scan_id:
        description: 'Unique scan identifier'
        required: true
        type: string
      findings_artifact:
        description: 'Name of the uploaded artifact containing findings.json'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The shared engine consumes findings INLINE as base64 (input: findings_json),
  # not as an artifact, so we pack them here first. This job is also the single
  # source of truth for client_id (consumed by both analyze and store).
  prep:
    name: Prepare findings
    runs-on: ubuntu-latest
    outputs:
      findings_json: ${{ steps.pack.outputs.findings_json }}
      client_id: ${{ steps.ids.outputs.client_id }}
    steps:
      - name: Download findings
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.findings_artifact }}
          path: incoming

      # client_name is caller-supplied, so it is passed through env rather than
      # interpolated into the script body (a name containing shell metacharacters
      # would otherwise be executed).
      - name: Derive client_id
        id: ids
        env:
          CLIENT: ${{ inputs.client_name }}
        run: |
          set -euo pipefail
          CLIENT_ID=$(printf '%s' "$CLIENT" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9\n' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::client_name '$CLIENT' does not yield a usable client_id"
            exit 1
          fi
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved client_id: $CLIENT_ID"

      - name: Pack findings as base64
        id: pack
        run: |
          set -euo pipefail
          FILE=$(find incoming -name findings.json | head -n1)
          if [ -z "$FILE" ]; then
            echo "::warning::findings.json not found in artifact — sending empty findings set"
            echo '{"findings":[]}' > /tmp/findings.json
            FILE=/tmp/findings.json
          fi
          # Gate: a malformed findings file must not reach the analysis engine.
          python3 -m json.tool "$FILE" > /dev/null || {
            echo "::error::findings.json is not valid JSON"; exit 1; }
          echo "findings_json=$(base64 -w0 "$FILE")" >> "$GITHUB_OUTPUT"

  # AI analysis is the single source of truth — delegated to the shared engine,
  # never re-implemented here. Input/secret contract VERIFIED against
  # IronCityIT/consensus-engine/.github/workflows/analyze.yml@main.
  analyze:
    name: AI Consensus Analysis
    needs: prep
    uses: IronCityIT/consensus-engine/.github/workflows/analyze.yml@main
    with:
      findings_json: ${{ needs.prep.outputs.findings_json }}
      product: threat-inspector
      client_id: ${{ needs.prep.outputs.client_id }}
      scan_id: ${{ inputs.scan_id }}
    # Engine requires GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY,
    # IRONCITY_API_KEY — all provided via the org-level secret inheritance chain.
    secrets: inherit

  store:
    name: Store Results
    needs: [prep, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Needed for tools/build_store_payload.py.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download findings
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.findings_artifact }}
          path: incoming

      # The payload builder is a tested module (tools/build_store_payload.py +
      # tests/test_store_payload.py), not an inline heredoc. It decides what the
      # client is ultimately shown about their scan, so it is covered by CI
      # rather than only exercised in a live run.
      - name: Build storeScanResults payload
        env:
          SCAN_TYPE: ${{ inputs.scan_type }}
          SCAN_ID: ${{ inputs.scan_id }}
          CLIENT_ID: ${{ needs.prep.outputs.client_id }}
          CLIENT_NAME: ${{ inputs.client_name }}
          TARGET: ${{ inputs.target }}
          CONSENSUS_STATUS: ${{ needs.analyze.result }}
        run: |
          set -euo pipefail
          python3 tools/build_store_payload.py \
            --findings incoming \
            --out payload.json \
            --scan-type "$SCAN_TYPE" \
            --scan-id "$SCAN_ID" \
            --client-id "$CLIENT_ID" \
            --client-name "$CLIENT_NAME" \
            --target "$TARGET" \
            --consensus-status "${CONSENSUS_STATUS:-unknown}"

      # Validation gate: never POST a payload that is not well-formed JSON.
      - name: Validate payload JSON
        run: |
          set -euo pipefail
          [ "$(head -c 1 payload.json)" = "{" ] || { echo "::error::payload.json does not start with {"; exit 1; }
          python3 -m json.tool payload.json > /dev/null
          echo "payload.json is valid JSON"

      # Firestore is the store of record, so this step FAILS CLOSED. An
      # unconfigured endpoint used to `exit 0` with a warning, which meant every
      # scan silently discarded its findings and still reported success — the
      # run went green while the client's results went nowhere. A scan that
      # cannot be stored is a failed scan, and it says so.
      - name: POST to storeScanResults
        env:
          STORE_URL: ${{ secrets.STORE_SCAN_RESULTS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${STORE_URL:-}" ]; then
            echo "::error::STORE_SCAN_RESULTS_URL is not set — results cannot be stored."
            echo "Deploy the function (deploy-functions.yml) and set the secret to its URL."
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$STORE_URL" \
            -H "Content-Type: application/json" \
            --data @payload.json)
          echo "storeScanResults responded HTTP $HTTP_CODE"
          cat response.txt || true
          case "$HTTP_CODE" in
            2*) echo "Results stored" ;;
            *)  echo "::error::store POST rejected (HTTP $HTTP_CODE)"; exit 1 ;;
          esac
