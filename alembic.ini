# Alembic configuration for the self-hosted scan-result store.
#
# There is deliberately NO sqlalchemy.url here. The connection string is a
# deployment fact and a credential-bearing one: putting it in a tracked file is
# how DSNs end up in git history. env.py reads DATABASE_URL from the
# environment and fails loudly if it is unset.

[alembic]
script_location = src/threat_inspector/storage/migrations
# Explicit, because the legacy default splits on spaces and colons too.
path_separator = os
prepend_sys_path = src
# Revision files are timestamped so two branches adding a migration on the same
# day produce filenames that sort in the order they were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
